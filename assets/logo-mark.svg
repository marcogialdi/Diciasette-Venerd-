<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" role="img" aria-label="Venerdì e Diciassette: due bambini, uno in piedi e uno a testa in giù">
  <title>Venerdì e Diciassette</title>
  <g stroke="#6b4f47" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- Bambino in piedi -->
    <!-- gambe e piedi -->
    <path d="M96 208 V250 M86 250 H98"/>
    <path d="M124 208 V250 M122 250 H134"/>
    <!-- braccia -->
    <path d="M80 130 Q70 160 66 190"/>
    <path d="M140 130 Q150 160 154 190"/>
    <!-- pantaloncini -->
    <path d="M82 170 H138 V210 H112 V188 H108 V210 H82 Z" fill="#a9c3e2"/>
    <!-- maglietta a righe -->
    <path d="M84 124 H136 L138 172 H82 Z" fill="#f4f1ec"/>
    <path d="M86 140 H134 M85 156 H135" stroke-width="3"/>
    <!-- testa -->
    <circle cx="110" cy="84" r="38" fill="#f4f1ec"/>
    <!-- capelli -->
    <path d="M66 96 C56 40 164 36 154 96 C150 84 146 78 140 76 L80 76 C74 78 70 84 66 96 Z" fill="#6b4f47" stroke-width="5"/>
    <!-- viso -->
    <circle cx="96" cy="92" r="3.5" fill="#6b4f47" stroke="none"/>
    <circle cx="124" cy="92" r="3.5" fill="#6b4f47" stroke="none"/>
    <circle cx="110" cy="100" r="2.5" fill="#6b4f47" stroke="none"/>
    <path d="M100 108 Q110 115 120 108" stroke-width="4"/>

    <!-- Bambino a testa in giù -->
    <!-- gambe e piedi in alto -->
    <path d="M236 64 V22 M236 22 H246"/>
    <path d="M276 64 V22 M266 22 H276"/>
    <!-- braccia che puntano verso il basso -->
    <path d="M222 156 Q212 130 210 104"/>
    <path d="M290 156 Q300 130 302 104"/>
    <!-- pantaloncini -->
    <path d="M226 62 H286 V104 H226 Z M256 62 V86" fill="#3fb3c2"/>
    <!-- maglietta a righe -->
    <path d="M226 104 H286 L284 152 H228 Z" fill="#f4f1ec"/>
    <path d="M228 120 H284 M228 136 H284" stroke-width="3"/>
    <!-- testa -->
    <circle cx="256" cy="194" r="40" fill="#f4f1ec"/>
    <!-- capelli (in basso, perché è capovolto) -->
    <path d="M212 182 C200 250 312 250 300 182 C298 200 290 210 280 212 L232 212 C222 210 214 200 212 182 Z" fill="#6b4f47" stroke-width="5"/>
    <!-- viso capovolto -->
    <circle cx="242" cy="190" r="3.5" fill="#6b4f47" stroke="none"/>
    <circle cx="270" cy="190" r="3.5" fill="#6b4f47" stroke="none"/>
    <circle cx="256" cy="182" r="2.5" fill="#6b4f47" stroke="none"/>
    <path d="M246 172 Q256 165 266 172" stroke-width="4"/>
  </g>
</svg>
